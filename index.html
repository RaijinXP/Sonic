<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
     <a href="index.html" class="logo">Sonic</a>
     <nav>
       <a href="#">Home</a>
       <a href="#">Products</a>
       <a href="#">About</a>
       <a href="#">Cart <span id="cart-count" class="cart-badge">0</span></a>
     </nav>
   </header>
    <h2 class="section-title">Featured Products</h2>
    <input type="text" id="search-input" placeholder="Search products..." />
    <select id="sort-select">
      <option value="default">Default</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="name-asc">Name: A to Z</option>
    </select>
    <div class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="headphones">Headphones</button>
      <button class="filter-btn" data-category="microphones">Microphones</button>
      <button class="filter-btn" data-category="speakers">Speakers</button>
    </div>
    <p id="product-count"></p>
    <div class="product" id="product-list">  
    </div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <footer>
      <p>© 2026 Sonic</p>
    </footer>
  </body>
</html>
